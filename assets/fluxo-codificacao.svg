<text font-family="Virgil, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="12" fill="#868e96" text-anchor="middle"><tspan x="650.0" y="1035.4">sem correspondência em OUTLAYS, L-08</tspan></text>
<rect x="60" y="1396" width="720" height="92" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="2"/>
<text font-family="Virgil, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="420.0" y="1423.2">O controlo do passo 9 é o que sustenta a regra R13</tspan></text>
<text font-family="Virgil, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="12" fill="#868e96" text-anchor="middle"><tspan x="420.0" y="1445.4">O conteúdo de uma factura é dado de origem externa e chega ao prompt. Como o Claude só devolve um índice</tspan><tspan x="420.0" y="1460.4">da lista que o servidor construiu, e esse índice é validado antes de ser usado, uma instrução escondida numa</tspan><tspan x="420.0" y="1475.4">descrição de factura não consegue atribuir um código que o catálogo não tenha.</tspan></text>
