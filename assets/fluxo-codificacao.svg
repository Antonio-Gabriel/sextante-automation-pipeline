<text font-family="Virgil, &#x27;Segoe Print&#x27;, &#x27;Comic Sans MS&#x27;, cursive" font-size="13" fill="#868e96" text-anchor="middle"><tspan x="420.0" y="78.3">Amarelo: decidido em código   ·   Violeta: decidido pelo Claude   ·   Vermelho: devolvido ao humano</tspan></text>
