# The one published entry of the application with Docker (deploy ticket 02): the compiled
# frontend, and /api forwarded to the API container on the same origin, so the session
# cookie (Path=/api, SameSite=Strict) works and there is no CORS (SEC-11).
server_tokens off;

server {
    # Every interface of this container: the published port arrives there, never on its
    # 127.0.0.1. The host publishes it on 127.0.0.1 only (decision 3.26 of docs/00).
    listen 0.0.0.0:8080;
    server_name _;
    root /usr/share/nginx/html;

    # 50 files of at most 25 MiB in one upload (platform/limits.py), plus the form's framing.
    client_max_body_size 1260m;

    # Docker's own name server: the API's name is resolved per request, so this server
    # starts, and recovers, whether or not the API container is up yet.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        # A variable without a path: the request's own path is passed unchanged.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # The API sends its own nosniff on downloads; one copy, from the snippet, is kept.
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # Compiled assets carry a content hash in their name: they never change.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Every other path is a page of the single-page application.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
