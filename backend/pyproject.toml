[project]
name = "sextante"
version = "0.1.0"
description = "Automatic coding of supplier invoice lines for AMT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "openpyxl>=3.1,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<1",
    "alembic>=1.14,<2",
    "rapidfuzz>=3.10,<4",
    "python-multipart>=0.0.18,<1",
    "pyyaml>=6.0,<7",
    "pdfplumber>=0.11,<0.12",
    "anthropic>=1.17,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx2>=2.16,<3",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "import-linter>=2.1,<3",
    "pip-licenses>=5.0,<6",
    "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The versioned prompts ship with the package (02-arquitectura.md §2.4).
[tool.setuptools.package-data]
sextante = ["prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "requirement(*ids): traceability to REQ-, NFR-, SEC-, D- or L- identifiers (04-padroes-de-codigo.md §3.4)",
]
filterwarnings = ["error"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N", "C90", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.importlinter]
root_package = "sextante"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "ingestion layers point inwards"
type = "layers"
layers = [
    "sextante.ingestion.api",
    "sextante.ingestion.infrastructure",
    "sextante.ingestion.application",
    "sextante.ingestion.domain",
]
containers = []

[[tool.importlinter.contracts]]
name = "matching layers point inwards"
type = "layers"
layers = [
    "sextante.matching.infrastructure",
    "sextante.matching.application",
    "sextante.matching.domain",
]
containers = []

[[tool.importlinter.contracts]]
name = "export layers point inwards"
type = "layers"
layers = [
    "sextante.export.api",
    "sextante.export.infrastructure",
    "sextante.export.application",
    "sextante.export.domain",
]
containers = []

[[tool.importlinter.contracts]]
name = "api depends on application, never on infrastructure"
type = "forbidden"
source_modules = ["sextante.ingestion.api", "sextante.review.api", "sextante.export.api"]
forbidden_modules = [
    "sextante.ingestion.infrastructure",
    "sextante.matching.infrastructure",
    "sextante.export.infrastructure",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "modules reach each other only through contracts"
type = "forbidden"
source_modules = ["sextante.matching", "sextante.review", "sextante.export"]
forbidden_modules = [
    "sextante.ingestion.domain",
    "sextante.ingestion.application",
    "sextante.ingestion.infrastructure",
]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "catalog layers point inwards"
type = "layers"
layers = [
    "sextante.catalog.infrastructure",
    "sextante.catalog.application",
    "sextante.catalog.domain",
]
containers = []

[[tool.importlinter.contracts]]
name = "other modules reach the catalog only through its contracts"
type = "forbidden"
source_modules = ["sextante.platform"]
forbidden_modules = [
    "sextante.catalog.domain",
    "sextante.catalog.application",
    "sextante.catalog.infrastructure",
]
# Reaching the domain through sextante.catalog.contracts is the allowed path.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "domain does no I/O"
type = "forbidden"
source_modules = ["sextante.catalog.domain"]
forbidden_modules = ["openpyxl", "sqlalchemy", "fastapi", "sextante.platform.database"]
