# nginx of the ShardCloud container (decision 3.27 of docs/00). The platform terminates
# HTTPS and forwards to port 80; /api goes to the API on this container's 127.0.0.1.
# No `user` here: the entrypoint sets it only where changing user works (www-data); on a
# platform without capabilities nginx keeps the user it was given.
worker_processes auto;
pid /tmp/nginx.pid;
error_log stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    access_log /dev/stdout;
    client_body_temp_path /tmp/nginx-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    server {
        # Every interface of this container: the platform's traffic arrives there.
        listen 0.0.0.0:80;
        server_name _;
        root /usr/share/sextante/www;

        # 50 files of at most 25 MiB in one upload (platform/limits.py), plus framing.
        client_max_body_size 1260m;

        location /api/ {
            include /etc/nginx/snippets/security-headers.conf;
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_hide_header X-Content-Type-Options;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        location /assets/ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        location / {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri /index.html;
        }
    }
}
