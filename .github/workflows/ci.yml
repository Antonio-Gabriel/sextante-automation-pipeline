# Continuous integration (decision 3.27 of docs/00): every push and pull request, and the
# release pipeline before it publishes anything. No secret is used here, and no test
# calls the model (CLAUDE.md). The golden set needs the private samples and runs locally.
# Actions are pinned by commit, the version in the comment (SEC-20).
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Inside the release (a reused workflow, github.workflow is "Release") nothing is cancelled.
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make install
      - run: make lint typecheck boundaries
      - run: make test
      - run: make traceability-matrix licenses

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - run: npm run check

  security:
    name: Security audits
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history: a secret removed later is still in it (SEC-03).
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # SEC-20: known vulnerabilities in the locked dependencies, insecure code patterns,
      # vulnerable frontend dependencies, and secrets anywhere in the history.
      - name: Dependencies of the API (pip-audit)
        run: |
          python -m pip install --quiet pip-audit==2.10.1
          pip-audit --strict --require-hashes --requirement backend/requirements.lock
      - name: Code of the API (bandit, medium and high)
        run: |
          python -m pip install --quiet bandit==1.9.4
          bandit --quiet --recursive backend/src --severity-level medium
      - name: Dependencies of the frontend (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high --omit=dev
      - name: Secrets in the history (gitleaks)
        run: |
          docker run --rm -v "$PWD":/repo:ro \
            zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --redact --no-banner --exit-code 1

  images:
    name: Images (${{ matrix.image }})
    needs: [backend, frontend, security]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # The public image: any fixable HIGH or CRITICAL vulnerability fails the run.
          - image: shardcloud
            build: |
              deploy/shardcloud/build_context.sh build/shardcloud
              docker build --tag sextante-check --build-arg SEXTANTE_RELEASE_VERSION=ci build/shardcloud
            severity: HIGH,CRITICAL
          # The compose images run on 127.0.0.1 only: a fixable CRITICAL fails the run (SEC-20).
          - image: api
            build: docker build --tag sextante-check backend
            severity: CRITICAL
          - image: web
            build: docker build --tag sextante-check frontend
            severity: CRITICAL
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: ${{ matrix.build }}
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: sextante-check
          scanners: vuln
          severity: ${{ matrix.severity }}
          ignore-unfixed: true
          exit-code: "1"
