# Release (decisions 3.27 to 3.29 of docs/00): a tag vX.Y.Z publishes version X.Y.Z.
#   1. CI runs in full;
#   2. the image is built from the git context and pushed to the private Docker Hub
#      repository as X.Y.Z, then scanned;
#   3. the same context is kept as the artifact sextante-X.Y.Z-shardcloud: its zip, with
#      the Dockerfile at the root, is uploaded to ShardCloud by a person (README).
# Nothing calls ShardCloud: its API answers automated clients with a Cloudflare challenge.
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN. Variables: DOCKERHUB_REPOSITORY.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One release at a time; a release is never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Docker Hub
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Version from the tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build context from git, with the version written in
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: deploy/shardcloud/build_context.sh build/shardcloud HEAD "$VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/shardcloud
          push: true
          provenance: true
          sbom: true
          build-args: SEXTANTE_RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          image-ref: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.version.outputs.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # The artifact is the context itself: GitHub zips it on download, so the zip it gives
      # has the Dockerfile at its root and is uploaded to ShardCloud as it is.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sextante-${{ steps.version.outputs.version }}-shardcloud
          path: build/shardcloud/
          if-no-files-found: error
          retention-days: 30
      - name: How to put this version on ShardCloud
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ vars.DOCKERHUB_REPOSITORY }}
        run: |
          {
            echo "### Release $VERSION"
            echo "- Docker Hub: \`$IMAGE:$VERSION\`"
            echo "- ShardCloud build context: artifact **sextante-$VERSION-shardcloud**."
            echo ""
            echo "By hand: download that artifact (a zip with the Dockerfile at its root, as ShardCloud"
            echo "wants it), then ShardCloud → Custom Docker Images → sextante → Rebuild with it;"
            echo "when the build shows success, back the app up and restart it."
          } >> "$GITHUB_STEP_SUMMARY"

