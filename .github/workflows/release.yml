# Release (decisions 3.27 and 3.28 of docs/00): a tag vX.Y.Z publishes version X.Y.Z.
#   1. CI runs in full;
#   2. the image is built from the git context and pushed to the private Docker Hub
#      repository as X.Y.Z, then scanned;
#   3. after a person approves the "production" environment, the same context is pushed
#      to the deploy repository, whose push makes ShardCloud rebuild the app's image;
#   4. a person backs the app up and restarts it in ShardCloud's dashboard, and the job
#      waits until the public health check answers X.Y.Z.
# ShardCloud's API is not used: it answers automated clients with a Cloudflare challenge.
# Secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN, SHARDCLOUD_DEPLOY_KEY.
# Variables: DOCKERHUB_REPOSITORY, SHARDCLOUD_DEPLOY_REPOSITORY, SHARDCLOUD_URL.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One release at a time; a release is never cancelled half-way.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to Docker Hub
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Version from the tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Build context from git, with the version written in
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: deploy/shardcloud/build_context.sh build/shardcloud HEAD "$VERSION"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: build/shardcloud
          push: true
          provenance: true
          sbom: true
          build-args: SEXTANTE_RELEASE_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Scan the published image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          image-ref: ${{ vars.DOCKERHUB_REPOSITORY }}:${{ steps.version.outputs.version }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Zip the ShardCloud build context
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: cd build/shardcloud && zip -q -r -X "../sextante-$VERSION.zip" .
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shardcloud-context
          path: build/sextante-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to ShardCloud
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    # Configure required reviewers on this environment: a person approves each release.
    environment:
      name: production
      url: ${{ vars.SHARDCLOUD_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: shardcloud-context
          path: build
      - name: Push the context to the deploy repository
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          SHARDCLOUD_DEPLOY_REMOTE: git@github.com:${{ vars.SHARDCLOUD_DEPLOY_REPOSITORY }}.git
          SHARDCLOUD_DEPLOY_KEY: ${{ secrets.SHARDCLOUD_DEPLOY_KEY }}
        run: |
          mkdir build/context
          unzip -q "build/sextante-$VERSION.zip" -d build/context
          deploy/shardcloud/push_context.sh build/context "$VERSION"
      - name: What to do in ShardCloud now
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          {
            echo "### Release $VERSION: finish it in ShardCloud"
            echo "1. Wait until the app's Custom Image shows the build as *success*."
            echo "2. Create a backup of the app (Backups)."
            echo "3. Restart the app."
            echo ""
            echo "This job waits for the public address to answer $VERSION."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Wait for the release to answer
        env:
          VERSION: ${{ needs.publish.outputs.version }}
          SHARDCLOUD_URL: ${{ vars.SHARDCLOUD_URL }}
        run: deploy/shardcloud/wait_for_release.sh "$SHARDCLOUD_URL" "$VERSION" 60
